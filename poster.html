<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The World in One Picture — Thursday 19 November 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; }
  body {
    background: #f6f1e5;
    color: #16213a;
    font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
    padding: 22px 36px 20px 36px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- masthead: the day, named big ---------- */
  header { text-align: center; }
  .kicker {
    display: flex; align-items: center; gap: 18px;
    font-size: 23px; font-weight: 700; letter-spacing: 7px; color: #16213a;
  }
  .kicker::before, .kicker::after {
    content: ""; flex: 1; height: 4px; background: #c1272d;
  }
  .kicker span { white-space: nowrap; }
  .date {
    margin-top: 8px;
    font-size: 55px; font-weight: 800; letter-spacing: 1px; line-height: 1.05;
    white-space: nowrap;
  }
  .date .weekday { color: #c1272d; }
  .rule {
    margin-top: 10px;
    border-top: 5px solid #16213a;
    border-bottom: 2px solid #16213a;
    height: 9px;
  }

  /* ---------- panels: the picture carries the story ---------- */
  .panel {
    position: relative;
    overflow: hidden;
    border: 3px solid #16213a;
    border-radius: 3px;
    background: #22304a;
  }
  .panel img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .panel figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 40px 22px 15px 22px;
    background: linear-gradient(to bottom,
      rgba(8, 12, 22, 0) 0%,
      rgba(8, 12, 22, 0.45) 42%,
      rgba(8, 12, 22, 0.90) 100%);
    color: #ffffff;
  }
  .panel h2 {
    font-weight: 800; text-transform: uppercase;
    line-height: 1.08; letter-spacing: 0.3px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
  }
  .panel p {
    margin-top: 6px;
    font-size: 28px; line-height: 1.25; color: #e9edf5;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }

  .hero { margin-top: 14px; height: 330px; flex: 0 0 auto; }
  .hero h2 { font-size: 46px; }
  .hero figcaption { padding-top: 64px; }

  .grid {
    margin-top: 14px;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
  }
  .grid h2 { font-size: 40px; }
</style>
</head>
<body>

<header>
  <div class="kicker"><span>THE WORLD IN ONE PICTURE</span></div>
  <div class="date"><span class="weekday">THURSDAY</span> 19 NOVEMBER 2026</div>
  <div class="rule"></div>
</header>

<figure class="panel hero">
  <img src="assets/hero-summit.png" alt="Three leaders at a summit table before the flags of the United States, China and Russia, with the Shenzhen skyline behind them">
  <figcaption>
    <h2>Trump, Xi, Putin Meet in Shenzhen</h2>
    <p>First trilateral issues peace declaration, no breakthrough</p>
  </figcaption>
</figure>

<div class="grid">

  <figure class="panel">
    <img src="assets/panel-icj.png" alt="The Peace Palace in The Hague, with a judge's gavel and the scales of justice in front of it">
    <figcaption>
      <h2>Myanmar Guilty of Genocide</h2>
      <p>World Court orders reparations</p>
    </figcaption>
  </figure>

  <figure class="panel">
    <img src="assets/panel-tanker.png" alt="An oil tanker with dark smoke rising from it, sailing through a narrow rocky strait at sunset">
    <figcaption>
      <h2>Iran Says Tankers Hit Mines</h2>
      <p>UKMTO reports separate strike</p>
    </figcaption>
  </figure>

  <figure class="panel">
    <img src="assets/panel-gaza.png" alt="A tank beside a line of bright yellow concrete blocks, with ruined buildings behind the line">
    <figcaption>
      <h2>Israel Ends Gaza Yellow-Line Raid</h2>
      <p>First deep raid past ceasefire line</p>
    </figcaption>
  </figure>

  <figure class="panel">
    <img src="assets/panel-nasdaq.png" alt="A giant stock-market screen with a green chart line rising steeply, cheered by silhouetted traders">
    <figcaption>
      <h2>Anthropic's Record $81.3B IPO</h2>
      <p>Up 17% in Nasdaq debut</p>
    </figcaption>
  </figure>

</div>

</body>
</html>
